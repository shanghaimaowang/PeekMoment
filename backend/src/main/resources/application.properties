spring.profiles.default=local
server.address=${HOST:127.0.0.1}
server.port=${PORT:8080}
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:schema.sql,classpath:content.sql
spring.jackson.deserialization.fail-on-trailing-tokens=true
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.banner=false
peek.admin-username=${PEEK_ADMIN_USERNAME:}
peek.admin-password=${PEEK_ADMIN_PASSWORD:}
peek.demo-publish-token=${PEEK_DEMO_PUBLISH_TOKEN:}
peek.cors-origin=${PEEK_CORS_ORIGIN:}
