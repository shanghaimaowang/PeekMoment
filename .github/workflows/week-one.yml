name: Week one checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-and-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test frontend/miniprogram/tests/*.test.mjs mock/server.test.mjs qa/collection.test.mjs

  miniprogram-weixin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compile the WeChat mini program and check generated pages
        run: node qa/compile-weixin.mjs

  backend-h2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -ntp -f backend/pom.xml verify

  backend-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: peekmoment_test
          MYSQL_USER: peek_test
          MYSQL_PASSWORD: local_test_password
          MYSQL_ROOT_PASSWORD: local_ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run HTTP integration tests against MySQL 8
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/peekmoment_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: peek_test
          SPRING_DATASOURCE_PASSWORD: local_test_password
        run: mvn -B -ntp -f backend/pom.xml test
